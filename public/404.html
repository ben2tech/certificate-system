<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>กำลังเปลี่ยนเส้นทาง...</title>
    <script>
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var repo = "/certificate-system";
      if (path.startsWith(repo)) {
        var route = path.slice(repo.length);
        if (route && route !== "/" && route !== "/index.html") {
          window.location.replace(repo + "/#" + route + search + hash);
        } else {
          window.location.replace(repo + "/" + search + hash);
        }
      } else {
        window.location.replace("./" + search + hash);
      }
    </script>
  </head>
  <body>
  </body>
</html>
